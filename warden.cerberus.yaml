# Generated from project.yaml settings.runtime; regenerate with folio deploy render.
kind: cerberus-project/v1
owner: warden
namespace: local
project:
  id: warden
  name: "Warden"
resources:
  - id: warden
    name: "Warden"
    type: process
    project: warden
    connector: local
    config:
      command:
        - "~/.local/bin/warden"
        - serve
        - --managed
        - --addr
        - 127.0.0.1:8080
      mode: os_service
      # Credentials come from operator config or the app's own identity provider.
      # env_file, when set, is a reference to an owner-only file outside the repository.
      port: 8080
      run_from: workspace
      supervisor: auto
      url: http://127.0.0.1:8080/healthz
      health_check:
        url: http://127.0.0.1:8080/healthz
    tags:
      - api
      - go
      - daemon
      - warden
