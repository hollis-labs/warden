# Generated from project.yaml settings.runtime; regenerate with folio deploy render.
schema: fleet-deploy/v1
app: warden
repo: hollis-labs/warden
artifact: {name: "warden-{sha12}", tarball: "warden_{version}_{os}_{arch}.tar.gz", sums: SHA256SUMS}
targets:
  - id: warden-linux-amd64
    when: {os: linux, arch: amd64}
    hosts: [fleet-host]
    binary: warden
    install_root: "~/.local/share/fleet/releases/warden"
    symlinks:
      - path: "~/.local/bin/warden"
    preflight:
      - {kind: sqlite_backup, db: "~/.local/share/warden/warden.db", dest: "{backup_dir}/warden.pre-{version}.db"}
    # Cerberus supervises the process (Option B): it runs the symlink above and never builds or places the binary.
    restart: {via: cerberus, resource: warden}
    health:
      url: "http://127.0.0.1:8080/healthz"
      expect_status: [200]
      timeout: 30s
