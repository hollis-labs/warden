# warden on Substrate. The manifest is the shell: modules and config.
app: warden
variant: app-host
profiles: [agentic]
modules:
  add: [database, identity, cli]
config:
  logging: { level: info, format: text }
  httphost: { addr: "127.0.0.1:8080" }
  database:
    sqlite: { path: warden.db }
  auth: { mode: enforce }
  identity: { key_file: identity-signing.key, session_ttl: 12h }
  secrets: { state_dir: secrets }
  # The app's own block (internal/settings); the SUBSTRATE_CONFIG file overrides it key by key.
  warden:
    allowed_hosts: []
