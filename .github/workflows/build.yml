name: warden build
# Publishes the release tarballs (workflow artifacts only: no tag, no release, no install) that
# `fleet-install` reads; deployment descriptors ride inside the selected target tarball.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    uses: hollis-labs/tools/.github/workflows/go-app-build.yml@7aeb3f65de07c0c41cb0e59a1d6f8300fa3381bc
    with:
      working_directory: .
      targets: '["linux/amd64"]'
      app: warden
      main_pkg: ./cmd/warden
      test_cmd: "go vet ./... && go test -race -count=1 ./..."
      extra_files: deploy.yaml project.yaml warden.cerberus.yaml
